<html style="background-color:gray;">

  <head>
    <title>Teraxmas.io</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&amp;display=swap" rel="stylesheet">
    <script src="main.js"></script>
    <style>
      .choose {
        width: 100%;
        height: 15%;
        background-color: transparent;
        color: #828282;
        border: none;
        font-weight: 700;
      }

      .choosen {
        color: #557d1d;
      }

      input {
        color: black;
      }

      input::placeholder {
        color: #cccccc;
        opacity: 1;
      }

      button {
        cursor: pointer;
      }
    .hidden {
        display:none;
    }
    </style>
  </head>
  
  <body style="display:flex;justify-content:center;align-items:center;font: bold 13px / 21px Arial, Helvetica, sans-serif;">
    <canvas style="display:none;"></canvas>
  <div id="load" style="display:none;width:100%;height:100%;z-index:2 background-color:#dbdbdb;"><p style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">Connecting...</p></div>
    <div style="width: 85%; max-width: 760px; height: auto; min-height: 320px; background-color: lightgray; border-radius: 15px; box-shadow: 0 0 15px rgba(0, 0, 0, 0.2); margin: 0 auto; box-sizing: border-box; z-index:1;" id="menu">
      <span style="display:flex;justify-content:center;margin-top:25px;30: %;font-size: 250%;">Teraxmas.io</span>
      <div id="gamelist" style="--width: 350px;--height: 150px;display: flex;width: var(--width);height: var(--height);border-radius: 10px;{width: calc(50% - 100px);};margin-left: calc(50% - var(--width) / 2);overflow-y: auto;flex-direction:column;">

        <button class="choose localgames hidden" onclick="setgamemode('localhost')">LOCALHOST <a href="localhost.help.html" style="color: #339dbf;">help?</a> <span class="counttext">0</span>/<span class="counttext">0</span></button>
        <button class="choose localgames hidden" onclick="setgamemode('localnetwork')">Local Network <a href="localnetwork.help.html" style="color: #339dbf;">help?</a> <span class="counttext">0</span>/<span class="counttext">0</span></button>
        <button class="choose localgames hidden" onclick="setgamemode('customip')">Custom IP<a href="customip.safety.html" style="text-decoration:none; background-color:black;">⚠️</a> <a href="customip.help.html" style="color: #339dbf;">help?</a> <span class="counttext">0</span>/<span class="counttext">0</span></button>
        <button class="choose choosen" onclick="setgamemode('ffa')">FFA <span class="counttext">0</span>/<span class="counttext">0</span></button>
        <button class="choose" onclick="setgamemode('test')">test <span class="counttext">0</span>/<span class="counttext">0</span></button>
      </div><input spellcheck="false" autocomplete="off" maxlength="36" type="text" id="name" placeholder="This is the story of..." style="
    width: 250px;
    height: 35px;
    margin-left: calc(50% - 250px / 2);
    margin-top: 10px;
    border-width: 2px;
    border-style: solid;
    border-color: #cccccc;
    outline: none;
    text-align: center;
    font: bold 13px / 21px Arial, Helvetica, sans-serif;
"><br><button id="play" onclick="play();" style="
    border: 0px;
    width: 250px;
    height: 40px;
    background-color: #a9d86d;
    margin-left: calc(50% - 250px / 2);
    margin-top: 5px;
    text-shadow: 0px 1px 0 rgba(0,0,0,0.5);
    font: bold 13px / 21px Arial, Helvetica, sans-serif;
">Play</button>
        <br><div style="display:flex; justify-content:center;"><input type="checkbox" id="checkbox" ><span>Show local gamemodes</span></div>
        <script>
            document.getElementById("checkbox").addEventListener('change',function() {
                if (this.checked) {
                    document.querySelectorAll('.localgames').forEach(element => {
                        element.classList.remove('hidden');
                    });
                } else {
                    document.querySelectorAll('.localgames').forEach(element => {
                        element.classList.add('hidden');
                    });
                }
            })
        </script>
    </div>

  </body>

</html>
